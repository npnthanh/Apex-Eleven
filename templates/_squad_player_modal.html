  <div id="squadPlayerModal" class="player-modal-backdrop" style="display: none;">
    <div class="player-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="spmName">
<div class="pm-header">
        <div class="pm-avatar-wrap">
          <div class="pm-avatar-bust" id="spmAvatarBust">
            <div class="pm-player-head"></div>
            <div class="pm-jersey-body" id="spmJerseyGraphic">
              <div class="pm-jersey-stripes"></div>
              <div class="pm-jersey-num" id="spmJerseyNum"></div>
            </div>
          </div>
          <div class="pm-flag-badge" id="spmFlag"></div>
        </div>

        <div class="pm-header-info">
<div class="pm-top-actions">
            <button type="button" class="pm-action-btn" id="spmJerseySwapBtn" title="Đổi giao diện màu áo" style="display:inline-flex;align-items:center;justify-content:center;gap:3px;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 4h4l2 4 2-4h4l4 4-2 4h-2v10H6V12H4L2 8l2-4z" fill="url(#swapJerseyA)" stroke="#60a5fa" stroke-width="1.2"/><path d="M14 16l4-4 4 4m-4-4v9" stroke="#facc15" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="swapJerseyA" x1="2" y1="4" x2="20" y2="22"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#1e3a8a"/></linearGradient></defs></svg>
            </button>
            <button type="button" class="pm-close-btn" id="spmCloseBtn" title="Đóng cửa sổ">
              ✕
            </button>
          </div>
          <div class="pm-title-row">
            <h2 class="pm-player-name" id="spmName"></h2>
          </div>
          <div class="pm-cltt-row">
            <span class="pm-cltt-label">CLTT</span>
            <span class="pm-cltt-score" id="spmOvr"></span>
            <span class="pm-stars" id="spmStars"></span>
            <span class="pm-info-icon" title="Chất Lượng Tổng Thể" style="display:inline-flex;align-items:center;justify-content:center;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#38bdf8" stroke-width="2"/><line x1="12" y1="16" x2="12" y2="12" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="8" r="1.2" fill="#38bdf8"/></svg>
            </span>
          </div>
<div class="pm-meta-row">
            <div class="pm-meta-item">
              <span>Tuổi:</span>
              <b id="spmAge"></b>
            </div>
            <div class="pm-meta-item">
              <span>Vị trí:</span>
              <span class="pm-pos-badge" id="spmPos"></span>
            </div>
            <div class="pm-meta-item">
              <span>Kỹ năng:</span>
              <span class="pm-skill-val" id="spmSkill"></span>
            </div>
          </div>
        </div>
      </div>
<div class="pm-body">
<div class="pm-sidebar">
          <button type="button" class="pm-tab-btn active" data-tab="overview">Tổng quan</button>
          <button type="button" class="pm-tab-btn" data-tab="skills">Kỹ năng</button>
          <button type="button" class="pm-tab-btn" data-tab="style">Lối chơi</button>
          <button type="button" class="pm-tab-btn" data-tab="stats">Chỉ số</button>
        </div>
<div class="pm-content">
<div class="pm-tab-panel active" id="spmp-overview">
            <div class="pm-overview-grid">
              <div class="pm-ov-box">
                <span class="pm-ov-label">Nặng:</span>
                <span class="pm-ov-val" id="spmWeight"></span>
              </div>
              <div class="pm-ov-box">
                <span class="pm-ov-label">Cao:</span>
                <span class="pm-ov-val" id="spmHeight"></span>
              </div>
              <div class="pm-ov-box">
                <span class="pm-ov-label">Chân thuận:</span>
                <span class="pm-ov-val" id="spmFoot"></span>
              </div>
              <div class="pm-ov-box">
                <span class="pm-ov-label">Giá trị thị trường:</span>
                <span class="pm-ov-val pm-cash" id="spmValue"></span>
              </div>
              <div class="pm-ov-box">
                <span class="pm-ov-label">Lương mỗi tuần:</span>
                <span class="pm-ov-val pm-cash" id="spmWage"></span>
              </div>
              <div class="pm-ov-box">
                <span class="pm-ov-label">Phong độ:</span>
                <span class="pm-ov-val" id="spmFormPattern"></span>
              </div>
            </div>
          </div>
<div class="pm-tab-panel" id="spmp-skills">
            <div class="pm-skills-grid">
<div class="pm-skill-col">
                <div class="pm-col-head def">
                  <span class="pm-col-icon" style="display:inline-flex;align-items:center;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2L4 5v6.5C4 16.5 7.5 21 12 22c4.5-1 8-5.5 8-10.5V5l-8-3z" fill="url(#modalDefG)" stroke="#38bdf8" stroke-width="1.5"/><path d="M9 12l2 2 4-4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="modalDefG" x1="4" y1="2" x2="20" y2="22"><stop offset="0%" stop-color="#0284c7"/><stop offset="100%" stop-color="#0369a1"/></linearGradient></defs></svg>
                  </span>
                  <span class="pm-col-title">PHÒNG THỦ</span>
                  <span class="pm-col-avg" id="spmDefAvg"></span>
                </div>
                <div class="pm-attr-list" id="spmDefList">
</div>
              </div>
<div class="pm-skill-col">
                <div class="pm-col-head atk">
                  <span class="pm-col-icon" style="display:inline-flex;align-items:center;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" fill="url(#modalAtkG)" stroke="#f59e0b" stroke-width="1.2"/><defs><linearGradient id="modalAtkG" x1="3" y1="2" x2="21" y2="22"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#d97706"/></linearGradient></defs></svg>
                  </span>
                  <span class="pm-col-title">TẤN CÔNG</span>
                  <span class="pm-col-avg" id="spmAtkAvg"></span>
                </div>
                <div class="pm-attr-list" id="spmAtkList">
</div>
              </div>
<div class="pm-skill-col">
                <div class="pm-col-head phy">
                  <span class="pm-col-icon" style="display:inline-flex;align-items:center;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 7v10M18 7v10M3 9v6M21 9v6M6 12h12" stroke="url(#modalPhyG)" stroke-width="2.5" stroke-linecap="round"/><defs><linearGradient id="modalPhyG" x1="3" y1="7" x2="21" y2="17"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient></defs></svg>
                  </span>
                  <span class="pm-col-title">THỂ CHẤT</span>
                  <span class="pm-col-avg" id="spmPhyAvg"></span>
                </div>
                <div class="pm-attr-list" id="spmPhyList">
</div>
              </div>
            </div>

            <div class="pm-skills-footer">
              Thuộc tính chính cho cầu thủ này được đánh dấu nổi bật. Mọi cầu thủ đều có thể tập lên 200%.
            </div>
          </div>
<div class="pm-tab-panel" id="spmp-style">
            <div class="pm-style-wrap">
              <div class="pm-role-banner">
                <div class="pm-role-badge" id="spmRoleName"></div>
                <p class="pm-role-desc" id="spmRoleDesc"></p>
              </div>
              <div class="pm-traits-box">
                <div class="pm-tb-title">KỸ NĂNG ĐẶC BIỆT & THIÊN PHÚ (TRAITS)</div>
                <div class="pm-traits-list" id="spmTraitsList"></div>
              </div>
            </div>
          </div>
<div class="pm-tab-panel" id="spmp-stats">
            <div class="pm-stats-table-wrap">
              <table class="pm-stats-table">
                <thead>
                  <tr>
                    <th style="width: 33%;">SỰ NGHIỆP</th>
                    <th style="width: 34%;">GIẢI VÔ ĐỊCH</th>
                    <th style="width: 33%;">CÁC CÚP</th>
                  </tr>
                </thead>
                <tbody id="spmStatsTableBody">
</tbody>
              </table>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
<script type="application/json" id="squadPlayerProfiles">{{ player_profiles|tojson }}</script>
<script src="{{ url_for('static', filename='squad_player_modal.js') }}"></script>
